<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <title>Wanderling</title>
    <meta
      name="description"
      content="A little wanderer walks the world for you, under the same sky."
    />
    <meta name="theme-color" content="#2E3558" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Wanderling" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <script>
      // Paint the last known sky colour before anything loads, so launching
      // from the home screen never flashes a dark screen first.
      try {
        var sky = localStorage.getItem('wanderling.lastSky');
        if (sky && /^#[0-9a-f]{6}$/i.test(sky)) {
          document.documentElement.style.background = sky;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', sky);
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <div class="grain" aria-hidden="true"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
